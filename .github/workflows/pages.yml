# Publishes ./bootstrap to GitHub Pages, served at the domain in bootstrap/CNAME.
#
# Only the bootstrap goes here. The marketing site stays behind Caddy, which can
# set real headers — Pages cannot, and losing X-Frame-Options on a page whose
# main element is a download button is not a trade worth making. The bootstrap
# is different: hosting it apart from the rendezvous server is the whole point,
# since it is the only code a browser ever loads from a server.
#
# The inherited Pages deployment is not enabled for this fork: its CNAME is a
# placeholder and the shared bootstrap/rendezvous service is not operated here.
# Keep deployment manual so an application release cannot publish that page
# accidentally. Configure this fork's Pages domain and content before enabling
# an automatic trigger.
name: bootstrap-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so a superseded
# run still finishes rather than leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The published bytes are meant to be pinned by fingerprint, and later
      # watched by a job that compares what the live site serves against what
      # was released. Printing the digests at publish time is what makes that
      # comparison possible: this log is the record of what was intended.
      - name: Record bootstrap digests
        run: |
          echo "### Bootstrap digests (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find bootstrap -type f ! -name CNAME -print0 \
            | sort -z | xargs -0 sha256sum | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bootstrap
      - id: deploy
        uses: actions/deploy-pages@v4
