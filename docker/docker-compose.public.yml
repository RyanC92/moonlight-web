# =============================================================================
#  MoonlightWeb — public deployment (one owner, their own hosts).
#
#      cp docker/.env.public.example docker/.env      # set MW_DOMAIN
#      docker compose -f docker/docker-compose.public.yml up -d
#
#  What this is for: a browser on any network opens https://<MW_DOMAIN>, signs
#  in, and streams from hosts it has paired with — ViBeShine/Sunshine running
#  on the gaming PC, reached exactly as Moonlight reaches it (RTSP/RTP/ENet,
#  PIN pairing). Nothing is installed beside the host.
#
#  This file does NOT change the connection to the host. It only adds the
#  public leg: TLS in front of the app, and the firewall rules that keep the
#  app's own listeners private. See docs/PUBLIC.md.
#
#  Host networking is REQUIRED for both services, and for two different
#  reasons:
#
#    • The app: WebRTC binds an ephemeral UDP port per stream slot, and it
#      announces the address it believes it has. On a bridge network that
#      address is unreachable from outside, so media falls back to TCP.
#    • Caddy: it must reach 127.0.0.1:8080 so the app sees a loopback peer.
#      That is what makes the tunnel path and per-visitor rate limiting work.
# =============================================================================
services:
  moonlightweb:
    image: moonlightweb-hardened:latest
    container_name: moonlightweb
    restart: unless-stopped
    network_mode: host

    cap_drop: ["ALL"]

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=32m,mode=755
    shm_size: 256m

    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 512

    environment:
      TZ: ${TZ:-Etc/UTC}

      # The public name, bare host, no scheme. It is read by AppSettings and
      # reaches RequestGuard through CertManager::domain(), where it is what
      # makes this hostname trusted instead of "a local peer with a foreign
      # Host" (the DNS-rebinding case). It also replaces the upstream default
      # of moonlightweb.top, which this fork does not contact.
      MW_DOMAIN: ${MW_DOMAIN:?set MW_DOMAIN in docker/.env (for example mw.example.com)}

      # No rendezvous, STUN, UPnP or update check. The public leg is Caddy, not
      # the upstream introduction server, and nothing here should dial home.
      MW_LAN_ONLY: "1"
      MW_NO_TELEMETRY: "1"

      # Listener ports above 1024, so the non-root user needs no capability.
      # Caddy proxies to the HTTP one; the HTTPS one stays bound but must be
      # closed at the firewall (docs/PUBLIC.md, "Ports").
      MW_HTTP_PORT: "8080"
      MW_HTTPS_PORT: "8443"
      MW_UPNP: "0"

    volumes:
      - mw-data:/data

    healthcheck:
      test: ["CMD", "moonlightweb", "--status"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    container_name: mw-caddy
    restart: unless-stopped
    network_mode: host

    depends_on:
      moonlightweb:
        condition: service_healthy

    environment:
      MW_DOMAIN: ${MW_DOMAIN:?set MW_DOMAIN in docker/.env}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    # Caddy must bind 80/443. With every other capability dropped, that one is
    # the whole grant; it cannot use it to do anything else. The root
    # filesystem stays read-only and its state lives in the two volumes.
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 256

    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mw-data:
  caddy-data:
  caddy-config:
